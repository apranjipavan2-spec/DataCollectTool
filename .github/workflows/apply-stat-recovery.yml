name: Apply GK-INTERIM Stat Table Recovery

# Writes the recovered _statConfig into the live GK-INTERIM.tableforge file
# for the 12 confidently-resolved stat tables (see apply_stat_recovery.py's
# PATCH_PLAN). Takes a timestamped backup before writing. Also archives the
# old duplicate root-level GK-INTERIM.tableforge (a different, equally-broken
# 358-row snapshot from 2026-05-30) so only the current project shows in the
# list, and re-syncs the patched project into the FieldGovern-account store.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type YES to write to the live project file"
        required: true
        default: "YES"

jobs:
  apply:
    name: Patch + archive + re-sync
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout (for the scripts)
        uses: actions/checkout@v4

      - name: Copy scripts to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "tools/tableforge/backend/scripts/apply_stat_recovery.py,tools/tableforge/backend/scripts/recover_stat_configs.py,tools/tableforge/backend/scripts/sync_projects_to_account.py"
          target: "/tmp/apply-recovery/"

      - name: Apply via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 3m
          script: |
            set -e
            cd /opt/fieldgovern
            TENANT_ID="b3725f57-8c61-462b-89ed-3cf778ee6103"
            USER_ID="6781e087-d12b-43cb-9207-ec2a3f6093f2"
            DATA_ROOT=$(docker inspect analyzer --format '{{range .Mounts}}{{if eq .Destination "/app/projects"}}{{.Source}}{{end}}{{end}}' 2>/dev/null)
            echo "DATA_ROOT: $DATA_ROOT"
            SCRIPT_DIR="/tmp/apply-recovery/tools/tableforge/backend/scripts"

            TARGET="$DATA_ROOT/$USER_ID/GK-INTERIM.tableforge"
            SOURCE_XLSX="$DATA_ROOT/GK-INTERIM_data.xlsx"
            echo "Target: $TARGET"
            echo "Source headers: $SOURCE_XLSX"

            echo "=== Applying recovery ==="
            docker run --rm -v "$DATA_ROOT":/data -v "$SCRIPT_DIR":/scripts:ro python:3.11-slim sh -c \
              "pip install --quiet openpyxl && python3 /scripts/apply_stat_recovery.py '/data/$USER_ID/GK-INTERIM.tableforge' '/data/GK-INTERIM_data.xlsx'"

            echo ""
            echo "=== Archiving old duplicate root-level GK-INTERIM.tableforge ==="
            OLD_ROOT="$DATA_ROOT/GK-INTERIM.tableforge"
            if [ -f "$OLD_ROOT" ]; then
              mv "$OLD_ROOT" "$DATA_ROOT/GK-INTERIM-ARCHIVED-2026-05-30-358row.tableforge"
              echo "Archived: $OLD_ROOT -> GK-INTERIM-ARCHIVED-2026-05-30-358row.tableforge"
            else
              echo "Old root file not found (already handled?)"
            fi

            echo ""
            echo "=== Re-syncing patched GK-INTERIM into FieldGovern-account store ==="
            mkdir -p /tmp/proj_sync2
            cp "$DATA_ROOT/$USER_ID/GK-INTERIM.tableforge" /tmp/proj_sync2/GK-INTERIM.json
            docker compose exec -T app mkdir -p /tmp/proj_sync2
            docker compose cp /tmp/proj_sync2/GK-INTERIM.json app:/tmp/proj_sync2/GK-INTERIM.json
            docker compose cp /tmp/apply-recovery/tools/tableforge/backend/scripts/sync_projects_to_account.py app:/tmp/sync_projects_to_account.py
            docker compose exec -T app python3 /tmp/sync_projects_to_account.py "$TENANT_ID" "$USER_ID" \
              "GK-INTERIM=/tmp/proj_sync2/GK-INTERIM.json"
            rm -rf /tmp/proj_sync2

            echo ""
            echo "=== Verifying patched file ==="
            docker run --rm -v "$DATA_ROOT":/data:ro python:3.11-slim python3 -c "import json; d=json.load(open('/data/$USER_ID/GK-INTERIM.tableforge')); patched=[t['title'] for t in d['tables'] if t.get('_statConfig')]; print(f'{len(patched)} tables now have _statConfig:'); [print(' -', t) for t in patched]"
