name: TEMP verify 0062

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e
            cd /opt/fieldgovern
            docker compose exec -T app sh -c "alembic current"
            docker compose exec -T postgres psql -U fieldgovern -d fieldgovern -c \
              "SELECT column_name FROM information_schema.columns WHERE table_name='forms' AND column_name='deleted_at';"
            docker compose exec -T postgres psql -U fieldgovern -d fieldgovern -c \
              "SELECT column_name FROM information_schema.columns WHERE table_name='user_tool_projects' AND column_name='deleted_at';"
            docker compose exec -T postgres psql -U fieldgovern -d fieldgovern -c \
              "SELECT status, count(*), count(deleted_at) FROM forms GROUP BY status;"
            docker compose exec -T postgres psql -U fieldgovern -d fieldgovern -c \
              "SELECT (archived_at IS NOT NULL) AS archived, count(*), count(deleted_at) FROM user_tool_projects GROUP BY 1;"
