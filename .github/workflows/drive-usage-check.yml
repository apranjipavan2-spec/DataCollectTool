name: Check Google Drive usage (diagnostic, read-only)

# One-shot, read-only. Lists top-level folders in the backup Google Drive
# account and their sizes, plus overall account quota usage, so we can see
# what's actually filling the 25GB. Does not touch the VPS app or DB.
on:
  workflow_dispatch:

jobs:
  check:
    name: rclone about + per-folder size
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Query Drive via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            echo "=== Quota BEFORE ==="
            rclone about gdrive: || echo "  rclone about failed"

            echo ""
            echo "=== Emptying Drive Trash (user-confirmed, permanent delete of trashed items) ==="
            rclone cleanup gdrive: && echo "  trash emptied" || echo "  WARN: cleanup failed"

            echo ""
            echo "=== Quota AFTER ==="
            rclone about gdrive: || echo "  rclone about failed"
