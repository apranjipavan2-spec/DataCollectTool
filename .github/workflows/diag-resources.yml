name: Diagnose Server Resources

# Read-only: snapshot of host + container CPU/RAM/disk and recent crash-shaped
# log lines, to debug "app crashing / freezing" reports.
on:
  workflow_dispatch:

jobs:
  diag:
    name: Inspect VPS resources + container health
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Inspect via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 3m
          script: |
            cd /opt/fieldgovern
            echo "=== uptime / load ==="
            uptime
            echo ""
            echo "=== memory (host) ==="
            free -h
            echo ""
            echo "=== disk ==="
            df -h /
            echo ""
            echo "=== dmesg OOM-kill lines (if any) ==="
            dmesg 2>/dev/null | grep -i "out of memory\|oom-kill" | tail -20 || echo "no dmesg access or no OOM events"
            echo ""
            echo "=== container status ==="
            docker compose ps
            echo ""
            echo "=== container resource usage (live snapshot) ==="
            docker stats --no-stream
            echo ""
            echo "=== app container restart count ==="
            docker inspect -f '{{.RestartCount}}' $(docker compose ps -q app) 2>/dev/null || echo "n/a"
            echo ""
            echo "=== app container recent exit/crash log lines ==="
            docker compose logs --tail=300 app 2>&1 | grep -iE "error|traceback|killed|memoryerror|fatal|exception|restart" | tail -60 || echo "no matching log lines"
