name: Build & Deploy App

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "Dockerfile"
      - "deploy/**"
      - "tools/**"
      - ".github/workflows/deploy-app.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/apranjipavan2-spec/datacollecttool

jobs:
  build-and-push:
    name: Build Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Checkout (for deploy files)
        uses: actions/checkout@v4

      - name: Sync tools and compose file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "tools/,deploy/docker-compose.prod.yml"
          target: "/opt/fieldgovern/"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/fieldgovern

            # ── 1. Pull and restart main app ────────────────────────────────────
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u apranjipavan2-spec --password-stdin
            docker compose pull app
            docker compose up -d --no-deps app

            # ── 2. Run DB migrations ─────────────────────────────────────────────
            docker compose exec -T app sh -c "alembic upgrade head 2>&1 || true"

            # ── 3. Build analyzer and cleaner images on VPS ─────────────────────
            docker build -t fieldgovern-analyzer:latest /opt/fieldgovern/tools/tableforge
            docker build -t fieldgovern-cleaner:latest /opt/fieldgovern/tools/datacleaner

            # ── 4. Ensure a dedicated tools network exists and nginx is on it ────
            docker network create fg-tools 2>/dev/null || echo "fg-tools network already exists"
            NGINX_ID=$(docker ps -q -f "name=nginx" | head -1)
            echo "Nginx container ID: $NGINX_ID"
            if [ -z "$NGINX_ID" ]; then
              echo "ERROR: no running nginx container found"
              docker ps
              exit 1
            fi
            docker network connect fg-tools "$NGINX_ID" 2>/dev/null || echo "nginx already on fg-tools"

            # ── 5. Stop old containers and start fresh on fg-tools network ───────
            # Remove any containers whose name contains 'analyzer' or 'cleaner'
            # (catches compose-named variants like fieldgovern-analyzer-1 too)
            docker ps -aq -f "name=analyzer" | xargs docker rm -f 2>/dev/null || true
            docker ps -aq -f "name=cleaner"  | xargs docker rm -f 2>/dev/null || true
            docker run -d --name analyzer --network fg-tools --restart unless-stopped \
              -v fg_tableforge_data:/app/projects \
              -v fg_tableforge_exports:/app/exports \
              fieldgovern-analyzer:latest
            docker run -d --name cleaner --network fg-tools --restart unless-stopped \
              -v fg_cleaner_data:/app/working_copies \
              fieldgovern-cleaner:latest

            # ── 6. Reload nginx AFTER tools are running ──────────────────────────
            # Show exactly where nginx reads its config from
            echo "=== Nginx bind mounts ==="
            docker inspect "$NGINX_ID" --format '{{range .Mounts}}{{.Source}} -> {{.Destination}}{{"\n"}}{{end}}'

            # Find the actual host path for the nginx config inside the container
            NGINX_CONF_HOST=$(docker inspect "$NGINX_ID" --format '{{range .Mounts}}{{if eq .Destination "/etc/nginx/conf.d/default.conf"}}{{.Source}}{{end}}{{end}}')
            echo "Nginx config source on host: $NGINX_CONF_HOST"

            # Download updated config — write to both the detected path AND common fallbacks
            curl -fsSL "https://raw.githubusercontent.com/apranjipavan2-spec/DataCollectTool/main/deploy/nginx.conf" \
              -o /opt/fieldgovern/nginx.conf
            cp /opt/fieldgovern/nginx.conf /opt/fieldgovern/deploy/nginx.conf 2>/dev/null || true
            # Also write to the actual detected path if different
            if [ -n "$NGINX_CONF_HOST" ] && [ "$NGINX_CONF_HOST" != "/opt/fieldgovern/nginx.conf" ]; then
              cp /opt/fieldgovern/nginx.conf "$NGINX_CONF_HOST"
              echo "Copied config to detected path: $NGINX_CONF_HOST"
            fi

            echo "--- analyzer block in nginx.conf ---"
            grep -A4 "location /analyzer" /opt/fieldgovern/nginx.conf || echo "WARNING: no analyzer block found"
            echo "--- config inside container ---"
            docker exec "$NGINX_ID" cat /etc/nginx/conf.d/default.conf | grep -A4 "location /analyzer" || echo "WARNING: analyzer block NOT visible inside container"
            docker exec "$NGINX_ID" nginx -t
            docker exec "$NGINX_ID" nginx -s reload
            echo "Nginx reloaded"

            # ── 7. Diagnostics ───────────────────────────────────────────────────
            echo "=== Running containers ==="
            docker ps --format "table {{.Names}}\t{{.Status}}"
            echo "=== fg-tools network members ==="
            docker network inspect fg-tools --format '{{range .Containers}}{{.Name}} {{end}}'
            echo "=== Nginx networks ==="
            docker inspect "$NGINX_ID" --format '{{range $k,$v := .NetworkSettings.Networks}}  - {{$k}}{{"\n"}}{{end}}'

            # ── 8. Prune old images ──────────────────────────────────────────────
            docker image prune -f
            echo "Deploy complete — $(date)"

      - name: Health check
        run: |
          sleep 30
          curl -f https://app.fieldgovern.com/health || exit 1
          echo "Health check passed"
