name: Build & Deploy App

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "Dockerfile"
      - "deploy/**"
      - "tools/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/apranjipavan2-spec/datacollecttool

jobs:
  build-and-push:
    name: Build Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Checkout (for deploy files)
        uses: actions/checkout@v4

      - name: Sync tools and compose file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "tools/,deploy/docker-compose.prod.yml"
          target: "/opt/fieldgovern/"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/fieldgovern

            # ── 1. Pull and restart main app ────────────────────────────────────
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u apranjipavan2-spec --password-stdin
            docker compose pull app
            docker compose up -d --no-deps app

            # ── 2. Run DB migrations ─────────────────────────────────────────────
            docker compose exec -T app sh -c "alembic upgrade head 2>&1 || true"

            # ── 3. Build analyzer and cleaner images on VPS ─────────────────────
            docker build -t fieldgovern-analyzer:latest /opt/fieldgovern/tools/tableforge
            docker build -t fieldgovern-cleaner:latest /opt/fieldgovern/tools/datacleaner

            # ── 4. Attach tools to same network as nginx ─────────────────────────
            # Get the exact network nginx is connected to
            NGINX_ID=$(docker ps -q -f "name=nginx" | head -1)
            MAIN_NET=$(docker inspect "$NGINX_ID" --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{"\n"}}{{end}}' | grep -v '^$' | head -1)
            [ -z "$MAIN_NET" ] && MAIN_NET="fieldgovern_default"
            echo "Nginx is on network: $MAIN_NET"

            # Stop old containers (from any previous compose-based deploys)
            docker rm -f analyzer cleaner 2>/dev/null || true

            # Start with docker run — explicit network, no compose project ambiguity
            docker run -d --name analyzer --network "$MAIN_NET" --restart unless-stopped \
              -v fieldgovern_tableforge_data:/app/projects \
              -v fieldgovern_tableforge_exports:/app/exports \
              fieldgovern-analyzer:latest

            docker run -d --name cleaner --network "$MAIN_NET" --restart unless-stopped \
              -v fieldgovern_cleaner_data:/app/working_copies \
              fieldgovern-cleaner:latest

            # ── 5. Reload nginx AFTER tools are running ──────────────────────────
            curl -fsSL "https://raw.githubusercontent.com/apranjipavan2-spec/DataCollectTool/main/deploy/nginx.conf" \
              -o /opt/fieldgovern/nginx.conf
            docker compose exec -T nginx nginx -t
            docker compose exec -T nginx nginx -s reload
            echo "Nginx reloaded with updated config"

            # ── 6. Diagnostics ───────────────────────────────────────────────────
            echo "=== Running containers ==="
            docker ps --format "table {{.Names}}\t{{.Status}}"

            # ── 7. Prune old images ──────────────────────────────────────────────
            docker image prune -f
            echo "Deploy complete — $(date)"

      - name: Health check
        run: |
          sleep 30
          curl -f https://app.fieldgovern.com/health || exit 1
          echo "Health check passed"
