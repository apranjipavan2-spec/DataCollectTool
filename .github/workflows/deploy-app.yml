name: Build & Deploy App

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "Dockerfile"
      - "deploy/**"
      - "tools/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/apranjipavan2-spec/datacollecttool

jobs:
  build-and-push:
    name: Build Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Checkout (for deploy files)
        uses: actions/checkout@v4

      - name: Sync tools and compose file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "tools/,deploy/docker-compose.prod.yml"
          target: "/opt/fieldgovern/"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/fieldgovern

            # ── 1. Update nginx config from repo (always keep in sync) ──────────
            curl -fsSL "https://raw.githubusercontent.com/apranjipavan2-spec/DataCollectTool/main/deploy/nginx.conf" \
              -o /opt/fieldgovern/nginx.conf
            docker compose exec -T nginx nginx -t
            docker compose exec -T nginx nginx -s reload
            echo "Nginx config updated and reloaded"

            # ── 2. Pull latest app image ────────────────────────────────────────
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u apranjipavan2-spec --password-stdin
            docker compose pull app

            # ── 3. Restart app (zero-downtime) ──────────────────────────────────
            docker compose up -d --no-deps app

            # ── 4. Run DB migrations (idempotent — safe to run every deploy) ───
            docker compose exec -T app sh -c "alembic upgrade head 2>&1 || true"

            # ── 5. Build and restart analyzer + cleaner using prod compose file ─
            # -p fieldgovern ensures they join fieldgovern_default network (same as nginx)
            docker compose -p fieldgovern -f /opt/fieldgovern/deploy/docker-compose.prod.yml build analyzer cleaner
            docker compose -p fieldgovern -f /opt/fieldgovern/deploy/docker-compose.prod.yml up -d --no-deps analyzer cleaner

            # ── 6. Prune old images to save disk space ─────────────────────────
            docker image prune -f

            echo "Deploy complete — $(date)"

      - name: Health check
        run: |
          sleep 30
          curl -f https://app.fieldgovern.com/health || exit 1
          echo "Health check passed"
