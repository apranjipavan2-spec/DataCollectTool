name: Build & Deploy App

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "Dockerfile"
      - "deploy/**"
      - "tools/**"
      - ".github/workflows/deploy-app.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/apranjipavan2-spec/datacollecttool

jobs:
  build-and-push:
    name: Build Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Checkout (for deploy files)
        uses: actions/checkout@v4

      - name: Sync tools and compose file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "tools/,deploy/docker-compose.prod.yml"
          target: "/opt/fieldgovern/"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/fieldgovern

            # ── 1. Pull and restart main app ────────────────────────────────────
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u apranjipavan2-spec --password-stdin
            docker compose pull app
            docker compose up -d --no-deps app

            # ── 2. Run DB migrations ─────────────────────────────────────────────
            docker compose exec -T app sh -c "alembic upgrade head 2>&1"

            # ── 2b. Seed plans + bootstrap superuser (both idempotent) ───────────
            docker compose exec -T app sh -c "python -m scripts.seed_plans 2>&1"
            docker compose exec -T app sh -c "python -m scripts.create_superuser 2>&1"

            # ── 3. Build analyzer and cleaner images on VPS (no-cache to pick up all changes)
            docker build --no-cache -t fieldgovern-analyzer:latest /opt/fieldgovern/tools/tableforge
            docker build --no-cache -t fieldgovern-cleaner:latest /opt/fieldgovern/tools/datacleaner

            # ── 4. Find nginx container and its network ──────────────────────────
            NGINX_ID=$(docker ps -q -f "name=nginx" | head -1)
            if [ -z "$NGINX_ID" ]; then
              echo "ERROR: no running nginx container found"; docker ps; exit 1
            fi
            # Use nginx's own network so tools survive nginx restarts
            NGINX_NET=$(docker inspect "$NGINX_ID" \
              --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}' \
              | tr ' ' '\n' | grep -v '^$' | grep -v '^fg-tools$' | head -1)
            [ -z "$NGINX_NET" ] && NGINX_NET="fieldgovern_default"
            echo "Nginx ID=$NGINX_ID  Network=$NGINX_NET"

            # ── 5. Start tools on nginx's network ────────────────────────────────
            echo "Stopping and removing existing containers..."
            docker stop analyzer cleaner 2>/dev/null || true
            sleep 2
            docker rm -f analyzer cleaner 2>/dev/null || true
            sleep 2

            echo "Starting analyzer and cleaner..."
            docker run -d --name analyzer --network "$NGINX_NET" --restart unless-stopped \
              -v fg_tableforge_data:/app/projects \
              -v fg_tableforge_exports:/app/exports \
              fieldgovern-analyzer:latest
            docker run -d --name cleaner --network "$NGINX_NET" --restart unless-stopped \
              -v fg_cleaner_data:/app/working_copies \
              fieldgovern-cleaner:latest

            # ── 6. Update nginx config then RESTART nginx ─────────────────────────
            # The bind-mount inode was set at container-start 28 hours ago.
            # nginx -s reload re-reads the config file but the container is still
            # reading the ORIGINAL inode — changes on the host are NOT visible.
            # A full docker restart re-establishes the bind-mount to the current file.
            curl -fsSL "https://raw.githubusercontent.com/apranjipavan2-spec/DataCollectTool/main/deploy/nginx.conf" \
              -o /opt/fieldgovern/nginx.conf
            docker restart "$NGINX_ID"
            sleep 4
            NGINX_ID=$(docker ps -q -f "name=nginx" | head -1)
            echo "--- analyzer block inside container after restart ---"
            docker exec "$NGINX_ID" grep "location /analyzer" /etc/nginx/conf.d/default.conf \
              && echo "Config confirmed inside container ✓" \
              || echo "WARNING: still missing"

            # ── 7. Diagnostics ───────────────────────────────────────────────────
            echo "=== Running containers ==="
            docker ps --format "table {{.Names}}\t{{.Status}}"

            # ── 8. Prune old images ──────────────────────────────────────────────
            docker image prune -f
            echo "Deploy complete — $(date)"

      - name: Health check
        run: |
          sleep 30
          curl -f https://app.fieldgovern.com/health || exit 1
          echo "Health check passed"
