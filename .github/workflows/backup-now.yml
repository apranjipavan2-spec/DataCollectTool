name: Backup DB + set 2-hourly

# One-shot, safe to run anytime — including during live submissions.
# It ONLY reads the database (pg_dump) and edits the cron schedule.
# It does NOT restart the app, run migrations, or touch table data.
#
#   1. Takes a fresh backup right now (existing /opt/fieldgovern/backup-db.sh)
#   2. Switches the backup cron from daily (0 2) to every 2 hours (0 */2)
#   3. Reports whether offsite (Cloudflare R2) is configured + lists backups
on:
  workflow_dispatch:

jobs:
  backup:
    name: Backup + reschedule
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Run via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /opt/fieldgovern

            echo "=== 1. Fresh backup now (read-only pg_dump) ==="
            /opt/fieldgovern/backup-db.sh

            echo ""
            echo "=== 2. Switch cron to every 2 hours ==="
            # Rewrite the backup-db.sh cron line to 0 */2; leave every other
            # crontab line (SSL renew, etc) untouched. Idempotent.
            crontab -l 2>/dev/null > /tmp/ct || true
            sed -i -E 's#^0 2 \* \* \* (.*/backup-db\.sh.*)#0 */2 * * * \1#' /tmp/ct
            crontab /tmp/ct
            rm -f /tmp/ct
            echo "Current backup cron line:"
            crontab -l | grep backup-db || echo "  (no backup cron line found!)"

            echo ""
            echo "=== 3. Offsite (R2) status ==="
            grep -E '^R2_BUCKET=' /opt/fieldgovern/backup-db.sh || echo "  R2_BUCKET line not found"
            if command -v rclone >/dev/null 2>&1; then echo "  rclone: installed"; else echo "  rclone: NOT installed -> offsite is OFF"; fi

            echo ""
            echo "=== 4. Local backups on disk ==="
            ls -lah /opt/fieldgovern/backups/ | tail -8
            echo -n "Total backup dir size: "; du -sh /opt/fieldgovern/backups/ | cut -f1
