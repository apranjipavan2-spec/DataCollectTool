version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ghcr.io/apranjipavan2-spec/datacollecttool:latest
    restart: always
    env_file: .env
    environment:
      # DATABASE_URL = superuser: runs migrations + seeds (must bypass RLS to seed
      # across tenants). Keep as-is.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # APP_DATABASE_URL = restricted role for the request path so PostgreSQL RLS is
      # actually enforced (superusers bypass RLS). Enable AFTER a staging run — RLS
      # will start filtering any admin/analytics query that reads tenant tables
      # without a tenant context. Set APP_DB_PASSWORD in .env, then uncomment:
      # APP_DATABASE_URL: postgresql://fieldgovern_app:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      PORT: "8000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  analyzer:
    build:
      context: ../tools/tableforge
      dockerfile: Dockerfile
    restart: always
    environment:
      FG_INTERNAL_URL: "http://app:8000"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET}
    volumes:
      - tableforge_data:/app/projects
      - tableforge_exports:/app/exports
      - shared_uploads:/app/uploads
    expose:
      - "8001"

  cleaner:
    build:
      context: ../tools/datacleaner
      dockerfile: Dockerfile
    restart: always
    environment:
      ANALYZER_INTERNAL_URL: "http://analyzer:8001"
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET}
    volumes:
      - cleaner_data:/app/working_copies
      - shared_uploads:/app/uploads
    expose:
      - "8002"

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      - app
      - analyzer
      - cleaner

volumes:
  postgres_data:
  uploads:
  certbot_webroot:
  tableforge_data:
  tableforge_exports:
  cleaner_data:
  shared_uploads:

