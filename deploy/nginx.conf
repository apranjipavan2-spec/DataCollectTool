# Redirect all HTTP to HTTPS
server {
    listen 80;
    server_name app.fieldgovern.com;

    # Let's Encrypt ACME challenge (certbot webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — main app
server {
    listen 443 ssl;
    http2 on;
    server_name app.fieldgovern.com;

    ssl_certificate     /etc/letsencrypt/live/app.fieldgovern.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.fieldgovern.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Upload size limit — increase if you expect large Excel/photo uploads
    client_max_body_size 50M;

    # Block access to sensitive files — NEVER expose these publicly
    location ~ /\.env          { deny all; return 404; }
    location ~ /\.git          { deny all; return 404; }
    location ~ /\.ht           { deny all; return 404; }
    location ~ /\.ssh          { deny all; return 404; }
    location ~ \.(sql|bak|log|conf|key|pem)$ { deny all; return 404; }

    # Proxy to FastAPI app
    location / {
        proxy_pass         http://app:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # WebSocket support (for future use)
    location /ws {
        proxy_pass         http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }

    # Redirect no-trailing-slash to trailing-slash so location /analyzer/ matches
    location = /analyzer { return 301 /analyzer/; }
    location = /cleaner  { return 301 /cleaner/; }

    # Analyzer tool — served at /analyzer/ (no separate subdomain or SSL needed)
    location /analyzer/ {
        proxy_pass         http://analyzer:8001/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        client_max_body_size 200M;
    }

    # Cleaner tool — served at /cleaner/ (no separate subdomain or SSL needed)
    location /cleaner/ {
        proxy_pass         http://cleaner:8002/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 200M;
    }
}
